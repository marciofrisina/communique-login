<body>

  <script>
    (() => {
      const canvas = document.querySelector('#universe');

      const rgba = (rgb, a) => `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`;

      { code: 'GT', name: 'Guatemala' }, { code: 'HN', name: 'Honduras' }, { code: 'PA', name: 'Panama' }
    ];
    const flagEmoji = code => [...code].map(letter => String.fromCodePoint(127397 + letter.charCodeAt(0))).join('');
    function secureRandom(max) {
      return crypto.getRandomValues(new Uint32Array(1))[0] % max;
    }
    function animateNewNotification(total) {
      const panel = document.querySelector('#notification-panel');
      const count = document.querySelector('#notification-count');
      if (total !== undefined) count.textContent = String(total);
      panel.classList.remove('is-new');
      void panel.offsetWidth;
      panel.classList.add('is-new');
      const finish = event => {
        if (event.animationName !== 'notification-tile') return;
        panel.classList.remove('is-new');
        panel.removeEventListener('animationend', finish);
      };
      panel.addEventListener('animationend', finish);
    }
    window.showNewNotification = animateNewNotification;
    function prepareAccountOverview() {
      const notificationTotal = 10 + secureRandom(191);
      const countryTotal = 1 + secureRandom(7);
      const countries = [...availableCountries];
      for (let index = countries.length - 1; index > 0; index--) {
        const swapIndex = secureRandom(index + 1);
        [countries[index], countries[swapIndex]] = [countries[swapIndex], countries[index]];
      }
      const selectedCountries = countries.slice(0, countryTotal);
      document.querySelector('#notification-count').textContent = String(notificationTotal);
      document.querySelector('#country-count').textContent = `(${countryTotal})`;
      const countryList = document.querySelector('#country-list');
      countryList.classList.toggle('multi-column', countryTotal >= 4);
      countryList.replaceChildren(...selectedCountries.map(country => {
        const chip = document.createElement('span');
        chip.className = 'country-chip';
        const icon = document.createElement('span');
        icon.className = 'country-flag';
        icon.textContent = country.icon || flagEmoji(country.code);
        icon.setAttribute('aria-hidden', 'true');
        const name = document.createElement('span');
        name.className = 'country-name';
        name.textContent = country.name;
        chip.title = country.name;
        chip.append(icon, name);
        return chip;
      }));
      const updatedAt = new Date(document.lastModified);
      const updateElement = document.querySelector('#system-update');
      updateElement.dateTime = updatedAt.toISOString();
      updateElement.textContent = new Intl.DateTimeFormat(navigator.language || 'en', { year: 'numeric', month: 'short', day: 'numeric' }).format(updatedAt);
      const lastAccessElement = document.querySelector('#last-access');
      let previousAccess = null;
      try { previousAccess = localStorage.getItem('communique-last-successful-access'); } catch (_) {}
      const previousDate = previousAccess ? new Date(previousAccess) : null;
      if (previousDate && !Number.isNaN(previousDate.getTime())) {
        lastAccessElement.dateTime = previousDate.toISOString();
        lastAccessElement.textContent = new Intl.DateTimeFormat(navigator.language || 'en', { dateStyle: 'medium', timeStyle: 'short' }).format(previousDate);
      } else {
        lastAccessElement.removeAttribute('datetime');
        lastAccessElement.textContent = 'First access on this device';
      }
      try { localStorage.setItem('communique-last-successful-access', new Date().toISOString()); } catch (_) {}
    }
    form.addEventListener('submit', event => {
      event.preventDefault();
      if (!form.checkValidity()) { form.reportValidity(); return; }
      const username = document.querySelector('#email').value.trim().toLowerCase();
      if (username !== 'c' || password.value !== 'c') {
        status.textContent = 'Invalid credentials. Use c and c for this test.';
        return;
      }
      status.textContent = 'Access granted.';
      form.querySelectorAll('input, button').forEach(control => control.disabled = true);
      prepareAccountOverview();
      setTimeout(() => {
        flipCard.classList.add('is-flipped');
        loginFront.setAttribute('aria-hidden', 'true');
        loginBack.setAttribute('aria-hidden', 'false');
        setTimeout(() => animateNewNotification(), 720);
        setTimeout(() => goToCommunique.focus(), 1180);
      }, 240);
    });
    goToCommunique.addEventListener('click', () => location.reload());
  </script>
</body>
</html>
