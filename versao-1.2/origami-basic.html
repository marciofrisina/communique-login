  <link href="https://fonts.googleapis.com/css2?family=Alumni+Sans+Pinstripe&display=swap" rel="stylesheet" />
  <title>Communique 7 — Sign in · Version 1.2</title>
  <style>
    :root { background: #020307; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #020307; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #orbit-foreground { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    .orbiter-label { position: fixed; z-index: 4; min-width: 132px; padding: 7px 10px 8px; border: 1px solid rgba(255, 191, 119, .28); border-radius: 8px; pointer-events: none; opacity: 0; color: #ffe6c7; background: rgba(13, 9, 10, .84); box-shadow: 0 8px 28px rgba(0,0,0,.36), 0 0 18px rgba(255, 137, 70, .11); backdrop-filter: blur(10px); transform: translate(12px, -50%) scale(.96); transform-origin: left center; transition: opacity .18s ease, transform .18s ease; font: 500 12px/1.25 system-ui, sans-serif; letter-spacing: .02em; }
    .orbiter-label.visible { opacity: 1; transform: translate(12px, -50%) scale(1); }
    .orbiter-label small { display: block; margin-top: 2px; color: #a9907c; font-size: 9px; letter-spacing: .09em; text-transform: uppercase; }
    .veil { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 20%, rgba(0,0,0,.12) 55%, rgba(0,0,0,.78) 120%); }
    .login-wrap { position: fixed; z-index: 1; inset: 0; display: grid; place-items: center; padding: 24px; }
    .login-card { width: min(100%, 402px); padding: 34px 38px 31px; border: 1px solid rgba(190, 219, 255, .20); border-radius: 20px; color: #eff8ff; background: rgba(4, 8, 18, .66); box-shadow: 0 26px 100px rgba(0,0,0,.56), inset 0 1px 0 rgba(255,255,255,.10); backdrop-filter: blur(18px) saturate(1.15); -webkit-backdrop-filter: blur(18px) saturate(1.15); }
    .brand-name { margin: 0 0 8px; color: rgba(224, 239, 255, .94); text-align: center; font: 400 27px/1 "Alumni Sans Pinstripe", sans-serif; letter-spacing: .12em; }
    .brand { display: flex; justify-content: center; height: 84px; margin: 0 0 20px; }.brand img { width: 138px; height: 84px; object-fit: contain; opacity: .92; filter: saturate(1.18) contrast(1.06) brightness(1.12); }
    h1 { margin: 0; font: 600 27px/1.14 system-ui, sans-serif; letter-spacing: -.045em; }.intro { margin: 9px 0 25px; color: #9eacbb; font-size: 14px; line-height: 1.5; }
    .field { display: grid; gap: 8px; margin-top: 16px; } label, .options { color: #bfccd8; font: 500 12px/1.2 system-ui, sans-serif; }.input-wrap { position: relative; }
    input[type="email"], input[type="password"], input[type="text"] { width: 100%; height: 48px; padding: 0 45px 0 14px; border: 1px solid rgba(180, 209, 233, .17); border-radius: 10px; outline: none; color: #f4fbff; background: rgba(255,255,255,.055); font: 400 15px system-ui, sans-serif; transition: .2s; } input::placeholder { color: #6f7e8c; } input:focus { border-color: rgba(116, 234, 233, .82); box-shadow: 0 0 0 3px rgba(103,232,237,.10), 0 0 22px rgba(168, 112, 255, .11); }
    .toggle-password { position: absolute; top: 7px; right: 9px; height: 34px; border: 0; padding: 0 8px; color: #ace6eb; background: transparent; cursor: pointer; font: 500 12px system-ui, sans-serif; }
    .options { display: flex; justify-content: space-between; align-items: center; margin: 17px 0 22px; }.remember { display: flex; align-items: center; gap: 8px; cursor: pointer; } input[type="checkbox"] { accent-color: #78ece8; } a { color: #84e7ed; text-decoration: none; } a:hover { text-decoration: underline; }
    .submit { width: 100%; height: 50px; border: 0; border-radius: 10px; cursor: pointer; color: #061116; background: linear-gradient(105deg, #74e6e4, #a78cff); box-shadow: 0 9px 28px rgba(103, 194, 226, .23); font: 700 14px system-ui, sans-serif; transition: transform .2s, box-shadow .2s; }.submit:hover { transform: translateY(-2px); box-shadow: 0 12px 34px rgba(120, 137, 255, .36); }.submit:active { transform: translateY(0); }
    .status { min-height: 18px; margin: 13px 0 0; text-align: center; color: #9aeccd; font-size: 13px; line-height: 1.4; }.signup { margin: 23px 0 0; color: #9eacbb; text-align: center; font-size: 13px; line-height: 1.4; }.version { margin: 22px 0 0; color: #687785; text-align: center; font-size: 11px; letter-spacing: .08em; }
    .release-notes { display: grid; place-items: center; width: 28px; height: 28px; margin: 9px auto 0; border: 1px solid rgba(169, 198, 255, .15); border-radius: 50%; color: #8fbac8; transition: .2s; }.release-notes:hover, .release-notes:focus-visible { border-color: rgba(116,234,233,.7); color: #c6fbff; background: rgba(116,234,233,.08); box-shadow: 0 0 16px rgba(116,234,233,.13); outline: none; }.release-notes svg { width: 13px; height: 13px; }
    .origami-stage { position: fixed; z-index: 8; inset: 0; pointer-events: none; perspective: 1100px; transform-style: preserve-3d; }
    .origami-piece { position: fixed; margin: 0; overflow: hidden; clip-path: inset(var(--fold-from) 0 calc(100% - var(--fold-to)) 0); transform-origin: 50% var(--fold-origin); backface-visibility: visible; will-change: transform, opacity, filter; animation: origami-fold 1.75s cubic-bezier(.58,.02,.22,1) var(--fold-delay) both; }
    .origami-piece:nth-child(even) { animation-name: origami-fold-reverse; }
    body.origami-running .login-wrap > .login-card { visibility: hidden; }
    @keyframes origami-fold { 0% { opacity: 1; transform: rotateX(0) translateZ(0) scale(1); filter: brightness(1); } 34% { transform: rotateX(-26deg) translateZ(12px) scale(.985); filter: brightness(.88); } 70% { opacity: 1; transform: rotateX(-82deg) translateZ(4px) scale(.76); filter: brightness(.52); } 100% { opacity: 0; transform: rotateX(-90deg) translateZ(-28px) scale(.08); filter: brightness(.12); } }
    @keyframes origami-fold-reverse { 0% { opacity: 1; transform: rotateX(0) translateZ(0) scale(1); filter: brightness(1); } 34% { transform: rotateX(24deg) translateZ(10px) scale(.985); filter: brightness(.82); } 70% { opacity: 1; transform: rotateX(80deg) translateZ(2px) scale(.76); filter: brightness(.46); } 100% { opacity: 0; transform: rotateX(90deg) translateZ(-30px) scale(.08); filter: brightness(.10); } }
    @media (max-width: 460px) { .login-wrap { padding: 16px; }.login-card { padding: 29px 23px; border-radius: 16px; }.brand-name { font-size: 24px; }.brand { height: 72px; }.brand img { width: 120px; height:72px; } h1 { font-size: 25px; } }
    @media (prefers-reduced-motion: reduce) { .veil { background: rgba(2,3,7,.72); } }
  </style>
</head>
<body>
  <canvas id="universe" aria-label="Animated plasma universe with a slowly changing realistic Moon"></canvas>
  <canvas id="orbit-foreground" aria-hidden="true"></canvas>
  <div class="orbiter-label" id="orbiter-label" role="tooltip"><span></span><small><span id="orbiter-distance"></span> from Earth</small></div>
  <div class="veil"></div>
  <main class="login-wrap">
    <section class="login-card" aria-labelledby="login-title">
      <p class="brand-name">COMMUNIQUE 7</p>
      <div class="brand"><img src="communique-logo-336.webp" alt="Communique" /></div>
      <h1 id="login-title">Welcome back</h1>
      <p class="intro">Enter your credentials to continue.</p>
      <form id="login-form" novalidate>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="text" autocomplete="username" placeholder="name@company.com" required /></div>
        <div class="field"><label for="password">Password</label><div class="input-wrap"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required minlength="6" /><button class="toggle-password" type="button" aria-label="Show password">Show</button></div></div>
        <div class="options"><label class="remember"><input type="checkbox" name="remember" /> Remember me</label><a href="#recover">Forgot password?</a></div>
        <button class="submit" type="submit">Sign in</button><p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
      <p class="signup">Don't have an account? <a href="#signup">Request an account</a></p>
      <p class="version">VERSION 1.2 · ORIGAMI TEST</p>
      <a class="release-notes" href="release-notes.html" aria-label="View what's new" title="What's new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.75a6.75 6.75 0 0 1 6.75 6.75c0 7.75 2.5 8.75 2.5 8.75H2.75s2.5-1 2.5-8.75A6.75 6.75 0 0 1 12 2.75Z"/><path d="M9.5 21.25h5"/></svg></a>
    </section>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector('#universe');
      const ctx = canvas.getContext('2d');
      const orbitForeground = document.querySelector('#orbit-foreground');
      const orbitCtx = orbitForeground.getContext('2d');
      const orbiterLabel = document.querySelector('#orbiter-label');
      const orbiterLabelName = orbiterLabel.querySelector('span');
      const orbiterLabelDistance = document.querySelector('#orbiter-distance');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const moonImage = new Image();
      moonImage.src = 'nasa-moon.webp';
      const moonCycleSeconds = 2 * 60;
      const moonRotationSeconds = 75;
      const brightStars = [
        { name: 'Sirius', distance: '8.6 light-years' },
        { name: 'Procyon', distance: '11.4 light-years' },
        { name: 'Altair', distance: '16.8 light-years' },
        { name: 'Vega', distance: '25.3 light-years' },
        { name: 'Arcturus', distance: '37 light-years' },
        { name: 'Capella', distance: '42 light-years' },
        { name: 'Aldebaran', distance: '65 light-years' },
        { name: 'Canopus', distance: '313 light-years' }
      ];
      const moonPhases = [
        { name: 'New Moon', angle: 0 },
        { name: 'Waxing crescent', angle: Math.PI * .25 },
        { name: 'First quarter', angle: Math.PI * .5 },
        { name: 'Waxing gibbous', angle: Math.PI * .75 },
        { name: 'Full Moon', angle: Math.PI },
        { name: 'Waning gibbous', angle: Math.PI * 1.25 },
        { name: 'Last quarter', angle: Math.PI * 1.5 },
        { name: 'Waning crescent', angle: Math.PI * 1.75 },
        { name: 'Balsamic Moon', angle: Math.PI * 1.875 }
      ];
      const phaseSeed = crypto.getRandomValues(new Uint32Array(1))[0] % moonPhases.length;
      const moonStartAngle = moonPhases[phaseSeed].angle;
      const moonPlacementSeed = crypto.getRandomValues(new Uint32Array(2));
      const orbiterNameSeed = crypto.getRandomValues(new Uint32Array(1))[0];
      let previousStar = -1;
      try { const storedStar = localStorage.getItem('communique-last-orbiter-star'); if (storedStar !== null) previousStar = Number(storedStar); } catch (_) {}
      let starIndex = orbiterNameSeed % (brightStars.length - 1);
      if (Number.isInteger(previousStar) && previousStar >= 0 && previousStar < brightStars.length && starIndex >= previousStar) starIndex++;
      const selectedStar = brightStars[starIndex];
      try { localStorage.setItem('communique-last-orbiter-star', String(starIndex)); } catch (_) {}
      orbiterLabelName.textContent = selectedStar.name;
      orbiterLabelDistance.textContent = selectedStar.distance;
      const moonPlacement = {
        edge: ['top', 'right', 'bottom', 'left'][moonPlacementSeed[0] % 4],
        along: .18 + (moonPlacementSeed[1] / 0xffffffff) * .64,
        overlap: .08 + ((moonPlacementSeed[0] >>> 8) % 1000) / 1000 * .28
      };
      const pointer = { x: .5, y: .5 }, pointerTarget = { x: .5, y: .5 }, hoverPointer = { clientX: -999, clientY: -999 };
      let width, height, dpr, particles, blobs, sparks, filaments, galaxyClouds, meteors, orbiter, orbiterHit = null, filamentSteps, animationTime = 0, lastFrame = 0;
      const colors = [[72, 124, 234], [110, 165, 255], [167, 205, 255], [222, 236, 255]];
      const random = (min, max) => min + Math.random() * (max - min);
      const rgba = (rgb, a) => `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`;

      function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2); width = innerWidth; height = innerHeight;
        canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        orbitForeground.width = Math.round(width * dpr); orbitForeground.height = Math.round(height * dpr); orbitCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const physicalPixels = width * height * dpr * dpr;
        const detail = physicalPixels > 6000000 ? .50 : physicalPixels > 3200000 ? .68 : 1;
        const amount = Math.max(85, Math.round(Math.max(95, Math.min(180, width * height / 10500)) * detail));
        particles = Array.from({ length: amount }, () => ({ angle: random(0, Math.PI * 2), radius: random(.05, 1.16), drift: random(.006, .024) * (Math.random() < .5 ? -1 : 1), pulse: random(0, Math.PI * 2), size: random(.25, 1.25), color: colors[Math.floor(random(0, colors.length))] }));
        blobs = Array.from({ length: Math.round(6 + detail * 3) }, (_, i) => ({ angle: random(0, Math.PI * 2), radius: random(.10, .92), spread: random(.26, .54), phase: random(0, Math.PI * 2), rate: random(.008, .028) * (i % 2 ? -1 : 1), color: colors[Math.floor(random(0, 3))] }));
        sparks = Array.from({ length: Math.max(12, Math.round(amount * .16)) }, () => ({ angle: random(0, Math.PI * 2), radius: random(.18, 1.28), speed: random(.014, .043) * (Math.random() < .5 ? -1 : 1), phase: random(0, Math.PI * 2), size: random(.55, 1.85) }));
        filaments = Array.from({ length: Math.round(7 + detail * 3) }, (_, i) => ({ radius: random(.44, 1.08), squash: random(.43, .91), tilt: random(0, Math.PI), rate: random(.006, .025) * (i % 2 ? -1 : 1), phase: random(0, Math.PI * 2), alpha: random(.07, .20), width: random(.45, 1.25), color: colors[Math.floor(random(0, colors.length))] }));
        filamentSteps = Math.round(66 + detail * 30);
        galaxyClouds = Array.from({ length: 4 }, (_, i) => ({ x: i < 2 ? random(-.05, .26) : random(.74, 1.05), y: random(.04, .96), radius: random(.20, .39), squash: random(.28, .68), angle: random(-.8, .8), phase: random(0, Math.PI * 2), rate: random(.004, .012) * (i % 2 ? -1 : 1), color: [[47, 84, 180], [63, 108, 214], [82, 93, 184]][i % 3] }));
        meteors = [{ active: false, next: random(16, 36) }];
        orbiter = { radiusX: width * .50, radiusY: Math.max(height * .29, 175), tilt: -.18, phase: random(0, Math.PI * 2), speed: .043 };
      }

      function drawGalaxyClouds(t) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        galaxyClouds.forEach(cloud => {
          const r = Math.max(width, height) * cloud.radius;
          const x = width * cloud.x + Math.sin(t * cloud.rate + cloud.phase) * 26;
          const y = height * cloud.y + Math.cos(t * cloud.rate * .8 + cloud.phase) * 18;
          ctx.save(); ctx.translate(x, y); ctx.rotate(cloud.angle + Math.sin(t * .04 + cloud.phase) * .06); ctx.scale(1, cloud.squash);
          const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
          glow.addColorStop(0, rgba(cloud.color, .135)); glow.addColorStop(.32, rgba(cloud.color, .065)); glow.addColorStop(.72, rgba(cloud.color, .015)); glow.addColorStop(1, rgba(cloud.color, 0));
          ctx.fillStyle = glow; ctx.fillRect(-r, -r, r * 2, r * 2); ctx.restore();
        });
        ctx.restore();
      }

      function drawPlasma(t) {
        const cx = width * .5 + (pointer.x - .5) * 16, cy = height * .5 + (pointer.y - .5) * 11;
        const r = Math.max(215, Math.min(width, height) * .42);
        const base = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(width, height) * .72);
        base.addColorStop(0, '#0b1732'); base.addColorStop(.32, '#071127'); base.addColorStop(.72, '#030711'); base.addColorStop(1, '#020307'); ctx.fillStyle = base; ctx.fillRect(0, 0, width, height);
        drawGalaxyClouds(t);
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        blobs.forEach(blob => {
          const a = blob.angle + t * blob.rate;
          const orbit = blob.radius * r * (1 + Math.sin(t * .10 + blob.phase) * .10);
          const x = cx + Math.cos(a) * orbit * 1.04;
          const y = cy + Math.sin(a) * orbit * .72;
          const cloud = r * blob.spread * (1 + Math.sin(t * .19 + blob.phase) * .11);
          const gradient = ctx.createRadialGradient(x, y, 0, x, y, cloud);
          gradient.addColorStop(0, rgba(blob.color, .105)); gradient.addColorStop(.35, rgba(blob.color, .040)); gradient.addColorStop(1, rgba(blob.color, 0)); ctx.fillStyle = gradient; ctx.fillRect(x-cloud, y-cloud, cloud*2, cloud*2);
        });
        const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * .57);
        core.addColorStop(0, 'rgba(224, 239, 255, .23)'); core.addColorStop(.16, 'rgba(145, 193, 255, .15)'); core.addColorStop(.55, 'rgba(63, 121, 232, .055)'); core.addColorStop(1, 'rgba(42, 92, 190, 0)'); ctx.fillStyle = core; ctx.fillRect(cx-r*.6, cy-r*.6, r*1.2, r*1.2);
        ctx.restore();
      }

      function traceMoonlightMask(x, y, radius, phase, terminatorShift = 0) {
        const samples = 72;
        const waxing = phase <= Math.PI;
        const coefficient = Math.max(-1, Math.min(1, waxing ? Math.cos(phase) + terminatorShift : -Math.cos(phase) - terminatorShift));
        ctx.beginPath();
        for (let index = 0; index <= samples; index++) {
          const localY = -radius + radius * 2 * index / samples;
          const limb = Math.sqrt(Math.max(0, radius * radius - localY * localY));
          const terminator = coefficient * limb;
          const localX = waxing ? terminator : -limb;
          index ? ctx.lineTo(x + localX, y + localY) : ctx.moveTo(x + localX, y + localY);
        }
        for (let index = samples; index >= 0; index--) {
          const localY = -radius + radius * 2 * index / samples;
          const limb = Math.sqrt(Math.max(0, radius * radius - localY * localY));
          const localX = waxing ? limb : coefficient * limb;
          ctx.lineTo(x + localX, y + localY);
        }
        ctx.closePath();
      }

      function drawMoon(t) {
        if (!moonImage.complete || !moonImage.naturalWidth) return;
        const phase = (moonStartAngle + (reducedMotion ? 0 : t / moonCycleSeconds * Math.PI * 2)) % (Math.PI * 2);
        const radius = Math.max(48, Math.min(94, Math.min(width, height) * .092));
        const card = document.querySelector('.login-card').getBoundingClientRect();
        const edgeInset = radius * moonPlacement.overlap;
        let x;
        let y;
        if (moonPlacement.edge === 'top' || moonPlacement.edge === 'bottom') {
          x = card.left + card.width * moonPlacement.along;
          y = moonPlacement.edge === 'top' ? card.top - radius + edgeInset : card.bottom + radius - edgeInset;
        } else {
          x = moonPlacement.edge === 'left' ? card.left - radius + edgeInset : card.right + radius - edgeInset;
          y = card.top + card.height * moonPlacement.along;
        }
        x = Math.max(radius * .72, Math.min(width - radius * .72, x + (pointer.x - .5) * 5));
        y = Math.max(radius * .72, Math.min(height - radius * .72, y + (pointer.y - .5) * 4));
        const finalX = x;
        const finalY = y;
        let startX = finalX;
        let startY = finalY;
        if (moonPlacement.edge === 'top') startY = card.top + radius * 1.18;
        if (moonPlacement.edge === 'bottom') startY = card.bottom - radius * 1.18;
        if (moonPlacement.edge === 'left') startX = card.left + radius * 1.18;
        if (moonPlacement.edge === 'right') startX = card.right - radius * 1.18;
        const entranceProgress = reducedMotion ? 1 : Math.min(1, t / 7);
        const entranceEase = entranceProgress * entranceProgress * (3 - 2 * entranceProgress);
        x = startX + (finalX - startX) * entranceEase;
        y = startY + (finalY - startY) * entranceEase;
        const imageSize = radius * 2.30;
        const moonFade = 1;
        const surfaceTurn = reducedMotion ? moonStartAngle : t / moonRotationSeconds * Math.PI * 2;
        const surfaceShift = Math.sin(surfaceTurn) * radius * .08;
        const surfaceScaleX = .94 + Math.abs(Math.cos(surfaceTurn)) * .06;
        const axialRotation = Math.sin(surfaceTurn) * .075;

        ctx.save();
        ctx.fillStyle = '#010207';
        ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();

        ctx.save();
        ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.clip();
        ctx.globalAlpha = .94;
        ctx.filter = 'brightness(.19) saturate(.52) contrast(1.22)';
        ctx.translate(x + surfaceShift, y); ctx.rotate(axialRotation); ctx.scale(surfaceScaleX, 1);
        ctx.drawImage(moonImage, -imageSize / 2, -imageSize / 2, imageSize, imageSize);
        ctx.restore();

        const featherLayers = 40;
        for (let layer = 0; layer < featherLayers; layer++) {
          const normalized = layer / (featherLayers - 1);
          const shift = -.22 + normalized * .44;
          ctx.save();
          traceMoonlightMask(x, y, radius, phase, shift);
          ctx.clip();
          ctx.globalAlpha = .029 * moonFade;
          ctx.filter = 'brightness(1.08) saturate(.72) contrast(1.10)';
          ctx.translate(x + surfaceShift, y); ctx.rotate(axialRotation); ctx.scale(surfaceScaleX, 1);
          ctx.drawImage(moonImage, -imageSize / 2, -imageSize / 2, imageSize, imageSize);
          ctx.restore();
        }

        const edge = ctx.createRadialGradient(x - radius * .18, y - radius * .20, radius * .18, x, y, radius);
        edge.addColorStop(.58, 'rgba(210, 229, 246, 0)');
        edge.addColorStop(.88, 'rgba(7, 12, 23, .10)');
        edge.addColorStop(1, 'rgba(0, 2, 8, .58)');
        ctx.globalAlpha = moonFade;
        ctx.fillStyle = edge; ctx.beginPath(); ctx.arc(x, y, radius * .998, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      function drawFilaments(t) {
        const cx = width * .5 + (pointer.x - .5) * 16, cy = height * .5 + (pointer.y - .5) * 11;
        const baseR = Math.max(215, Math.min(width, height) * .42);
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        filaments.forEach(filament => {
          const rotation = filament.tilt + t * filament.rate;
          const cosR = Math.cos(rotation), sinR = Math.sin(rotation);
          ctx.beginPath();
          for (let i = 0; i <= filamentSteps; i++) {
            const theta = i / filamentSteps * Math.PI * 2;
            const wobble = 1 + Math.sin(theta * 3 + t * .17 + filament.phase) * .095 + Math.sin(theta * 7 - t * .11 + filament.phase) * .035;
            const x0 = Math.cos(theta) * baseR * filament.radius * wobble;
            const y0 = Math.sin(theta) * baseR * filament.radius * filament.squash * wobble;
            const x = cx + (x0 * cosR - y0 * sinR) * 1.18;
            const y = cy + x0 * sinR + y0 * cosR;
            i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
          }
          ctx.strokeStyle = rgba(filament.color, filament.alpha); ctx.lineWidth = filament.width; ctx.shadowColor = rgba(filament.color, .30); ctx.shadowBlur = 4; ctx.stroke();
        });
        ctx.restore();
      }

      function drawParticles(t) {
        const cx = width * .5 + (pointer.x - .5) * 16, cy = height * .5 + (pointer.y - .5) * 11;
        const baseR = Math.max(215, Math.min(width, height) * .42);
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        particles.forEach(p => {
          const angle = p.angle + t * p.drift + Math.sin(t * .15 + p.pulse) * .17;
          const radius = baseR * p.radius * (1 + Math.sin(t * .23 + p.pulse) * .055);
          const x = cx + Math.cos(angle) * radius * (1 + Math.sin(angle * 4 + p.pulse) * .05);
          const y = cy + Math.sin(angle) * radius * .76;
          const alpha = (.10 + (1 - Math.min(1, p.radius)) * .33) * (.65 + Math.sin(t * .55 + p.pulse) * .35);
          ctx.fillStyle = rgba(p.color, alpha); ctx.beginPath(); ctx.arc(x, y, p.size, 0, Math.PI * 2); ctx.fill();
        });
        sparks.forEach(spark => {
          const angle = spark.angle + t * spark.speed;
          const radius = baseR * spark.radius * (1 + Math.sin(t * .24 + spark.phase) * .06);
          const x = cx + Math.cos(angle) * radius; const y = cy + Math.sin(angle) * radius * .76;
          const glow = .18 + Math.max(0, Math.sin(t * .72 + spark.phase)) * .65;
          ctx.shadowColor = 'rgba(230,242,255,.75)'; ctx.shadowBlur = 4 + spark.size * 2; ctx.fillStyle = `rgba(235,246,255,${glow})`; ctx.beginPath(); ctx.arc(x, y, spark.size, 0, Math.PI * 2); ctx.fill();
        });
        ctx.restore();
      }

      function launchMeteor(meteor, t) {
        const fromTop = Math.random() < .55;
        meteor.x = fromTop ? random(-width * .12, width * 1.12) : (Math.random() < .5 ? -70 : width + 70);
        meteor.y = fromTop ? -70 : random(height * .05, height * .78);
        meteor.dx = fromTop ? random(-width * .30, width * .30) : (meteor.x < 0 ? width * random(.75, 1.25) : -width * random(.75, 1.25));
        meteor.dy = fromTop ? height * random(.72, 1.10) : height * random(.20, .54);
        meteor.duration = random(2.8, 4.4); meteor.start = t; meteor.active = true;
        meteor.color = Math.random() < .7 ? [188, 221, 255] : [132, 174, 255];
      }

      function drawMeteors(t) {
        if (reducedMotion) return;
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
        meteors.forEach(meteor => {
          if (!meteor.active && t >= meteor.next) launchMeteor(meteor, t);
          if (!meteor.active) return;
          const progress = (t - meteor.start) / meteor.duration;
          if (progress >= 1) { meteor.active = false; meteor.next = t + random(30, 55); return; }
          const x = meteor.x + meteor.dx * progress, y = meteor.y + meteor.dy * progress;
          const tail = Math.min(1, progress * 4, (1 - progress) * 5);
          const tx = x - meteor.dx * .115, ty = y - meteor.dy * .115;
          const trail = ctx.createLinearGradient(tx, ty, x, y);
          trail.addColorStop(0, rgba(meteor.color, 0)); trail.addColorStop(.58, rgba(meteor.color, .06 * tail)); trail.addColorStop(1, rgba([238, 247, 255], .84 * tail));
          ctx.strokeStyle = trail; ctx.lineWidth = 1.4 + tail * 1.4; ctx.shadowColor = rgba(meteor.color, .70); ctx.shadowBlur = 12; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(x, y); ctx.stroke();
          ctx.fillStyle = rgba([244, 250, 255], .78 * tail); ctx.beginPath(); ctx.arc(x, y, 1.15 + tail * 1.35, 0, Math.PI * 2); ctx.fill();
        });
        ctx.restore();
      }

      function orbitPoint(t) {
        const theta = orbiter.phase + t * orbiter.speed;
        const cx = width * .5 + (pointer.x - .5) * 16, cy = height * .5 + (pointer.y - .5) * 11;
        const x0 = Math.cos(theta) * orbiter.radiusX, y0 = Math.sin(theta) * orbiter.radiusY;
        const cosTilt = Math.cos(orbiter.tilt), sinTilt = Math.sin(orbiter.tilt);
        return { x: cx + x0 * cosTilt - y0 * sinTilt, y: cy + x0 * sinTilt + y0 * cosTilt, depth: (Math.sin(theta) + 1) * .5 };
      }

      function drawOrbiter(target, head, tail, pulse, brightness) {
        const trail = target.createLinearGradient(tail.x, tail.y, head.x, head.y);
        trail.addColorStop(0, 'rgba(255, 139, 71, 0)');
        trail.addColorStop(.42, `rgba(255, 166, 82, ${.025 * brightness})`);
        trail.addColorStop(.78, `rgba(255, 185, 108, ${.12 * brightness})`);
        trail.addColorStop(1, `rgba(255, 221, 169, ${.47 * brightness})`);
        target.save(); target.globalCompositeOperation = 'lighter'; target.lineCap = 'round'; target.strokeStyle = trail; target.lineWidth = 1.15 + head.depth * .7; target.shadowColor = 'rgba(255, 137, 70, .60)'; target.shadowBlur = 9;
        target.beginPath(); target.moveTo(tail.x, tail.y); target.lineTo(head.x, head.y); target.stroke();
        const halo = target.createRadialGradient(head.x, head.y, 0, head.x, head.y, 23 + head.depth * 9);
        halo.addColorStop(0, `rgba(255, 248, 231, ${.76 * pulse * brightness})`);
        halo.addColorStop(.13, `rgba(255, 195, 119, ${.38 * pulse * brightness})`);
        halo.addColorStop(.48, `rgba(255, 118, 57, ${.10 * pulse * brightness})`);
        halo.addColorStop(1, 'rgba(255, 89, 43, 0)');
        target.fillStyle = halo; target.fillRect(head.x - 34, head.y - 34, 68, 68);
        target.fillStyle = `rgba(255, 246, 224, ${.88 * brightness})`; target.beginPath(); target.arc(head.x, head.y, 1.8 + head.depth * 1.1, 0, Math.PI * 2); target.fill();
        target.restore();
      }

      function drawHiddenOrbit(t) {
        if (reducedMotion) return;
        const head = orbitPoint(t), tail = orbitPoint(t - 1.35);
        orbiterHit = head;
        const pulse = .72 + Math.sin(t * 1.12) * .16 + Math.sin(t * .47) * .08;
        const brightness = .45 + head.depth * .55;
        drawOrbiter(head.depth >= .5 ? orbitCtx : ctx, head, tail, pulse, brightness);
      }

      function updateOrbiterRollover(event) {
        if (!orbiterHit || reducedMotion) return;
        const distance = Math.hypot(event.clientX - orbiterHit.x, event.clientY - orbiterHit.y);
        const visible = distance <= 34;
        orbiterLabel.classList.toggle('visible', visible);
        orbiterLabel.style.left = `${Math.min(width - 132, Math.max(8, orbiterHit.x))}px`;
        orbiterLabel.style.top = `${Math.min(height - 28, Math.max(28, orbiterHit.y))}px`;
      }

      function draw(ms) {
        if (!lastFrame) lastFrame = ms;
        const delta = Math.min((ms - lastFrame) / 1000, 1 / 30); lastFrame = ms;
        if (!reducedMotion) animationTime += delta;
        const pointerEase = 1 - Math.pow(.965, delta * 60);
        pointer.x += (pointerTarget.x - pointer.x) * pointerEase; pointer.y += (pointerTarget.y - pointer.y) * pointerEase;
        orbitCtx.clearRect(0, 0, width, height);
        drawPlasma(animationTime); drawMoon(animationTime); drawFilaments(animationTime); drawParticles(animationTime); drawMeteors(animationTime); drawHiddenOrbit(animationTime); updateOrbiterRollover(hoverPointer); requestAnimationFrame(draw);
      }
      addEventListener('resize', resize, { passive: true }); addEventListener('pointermove', event => { hoverPointer.clientX = event.clientX; hoverPointer.clientY = event.clientY; pointerTarget.x = event.clientX / width; pointerTarget.y = event.clientY / height; }, { passive: true });
      addEventListener('pointerleave', () => { hoverPointer.clientX = -999; hoverPointer.clientY = -999; orbiterLabel.classList.remove('visible'); }, { passive: true });
      resize(); requestAnimationFrame(draw);
    })();
    const form = document.querySelector('#login-form'); const password = document.querySelector('#password'); const toggle = document.querySelector('.toggle-password'); const status = document.querySelector('#status');
    toggle.addEventListener('click', () => { const visible = password.type === 'text'; password.type = visible ? 'password' : 'text'; toggle.textContent = visible ? 'Show' : 'Hide'; toggle.setAttribute('aria-label', visible ? 'Show password' : 'Hide password'); });
    function runOrigamiFold() {
      const card = document.querySelector('.login-card');
      const rect = card.getBoundingClientRect();
      const stage = document.createElement('div');
      stage.className = 'origami-stage';
      const folds = [[0, 25], [25, 50], [50, 75], [75, 100]];
      folds.forEach(([from, to], index) => {
        const piece = card.cloneNode(true);
        piece.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
        piece.querySelectorAll('input, button, a').forEach(node => node.tabIndex = -1);
        piece.classList.add('origami-piece');
        piece.setAttribute('aria-hidden', 'true');
        piece.style.left = `${rect.left}px`;
        piece.style.top = `${rect.top}px`;
        piece.style.width = `${rect.width}px`;
        piece.style.height = `${rect.height}px`;
        piece.style.setProperty('--fold-from', `${from}%`);
        piece.style.setProperty('--fold-to', `${to}%`);
        piece.style.setProperty('--fold-origin', `${index % 2 ? from : to}%`);
        piece.style.setProperty('--fold-delay', `${index * 90}ms`);
        stage.appendChild(piece);
      });
      document.body.appendChild(stage);
      requestAnimationFrame(() => document.body.classList.add('origami-running'));
      setTimeout(() => location.reload(), 2450);
    }
    form.addEventListener('submit', event => {
      event.preventDefault();
      if (!form.checkValidity()) { form.reportValidity(); return; }
      const username = document.querySelector('#email').value.trim().toLowerCase();
      if (username !== 'communique' || password.value !== 'cinemark') {
        status.textContent = 'Invalid credentials. Use communique and cinemark for this test.';
        return;
      }
      status.textContent = 'Access granted.';
      form.querySelectorAll('input, button').forEach(control => control.disabled = true);
      setTimeout(runOrigamiFold, 240);
    });
  </script>
</body>
</html>
