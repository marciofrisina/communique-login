<body>
  <svg class="liquid-filters" aria-hidden="true" focusable="false">
    <filter id="liquid-distortion" x="-20%" y="-20%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".006 .024" numOctaves="2" seed="17" result="liquid-noise">
        <animate attributeName="baseFrequency" values=".006 .024;.010 .036;.005 .021" dur="3.6s" repeatCount="1" fill="freeze" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="liquid-noise" scale="0" xChannelSelector="R" yChannelSelector="B">
        <animate attributeName="scale" values="0;3;9;17;25" keyTimes="0;.18;.43;.72;1" dur="3.6s" repeatCount="1" fill="freeze" />
      </feDisplacementMap>
    </filter>
  </svg>
  <canvas id="universe" aria-label="Animated plasma universe with a slowly changing realistic Moon"></canvas>
  <canvas id="orbit-foreground" aria-hidden="true"></canvas>
  <div class="orbiter-label" id="orbiter-label" role="tooltip"><span></span><small><span id="orbiter-distance"></span> from Earth</small></div>
  <div class="veil"></div>
  <main class="login-wrap">
    <section class="login-card" aria-labelledby="login-title">
      <p class="brand-name">COMMUNIQUE 7</p>
      <div class="brand"><img src="communique-logo-336.webp" alt="Communique" /></div>
      <h1 id="login-title">Welcome back</h1>
      <form id="login-form" novalidate>
        <div class="field"><label for="email">User or Email</label><div class="input-wrap"><span class="location-flag" id="location-flag" role="img" aria-label="Detecting location" title="Detecting location">·</span><input id="email" name="email" type="text" autocomplete="username" placeholder="User or email" required /></div></div>
        <div class="field"><label for="password">Password</label><div class="input-wrap"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required minlength="6" /><button class="toggle-password" type="button" aria-label="Show password">Show</button></div></div>
        <div class="options"><label class="remember"><input type="checkbox" name="remember" /> Remember me</label><a href="#recover">Forgot password?</a></div>

      <a class="release-notes" href="release-notes.html" aria-label="View what's new" title="What's new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.75a6.75 6.75 0 0 1 6.75 6.75c0 7.75 2.5 8.75 2.5 8.75H2.75s2.5-1 2.5-8.75A6.75 6.75 0 0 1 12 2.75Z"/><path d="M9.5 21.25h5"/></svg></a>
    </section>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector('#universe');
      const ctx = canvas.getContext('2d');
      const orbitForeground = document.querySelector('#orbit-foreground');
      const orbitCtx = orbitForeground.getContext('2d');
      const orbiterLabel = document.querySelector('#orbiter-label');
      const orbiterLabelName = orbiterLabel.querySelector('span');
      const orbiterLabelDistance = document.querySelector('#orbiter-distance');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const moonImage = new Image();
      moonImage.src = 'nasa-moon.webp';
      const moonCycleSeconds = 2 * 60;
      const moonRotationSeconds = 75;
      const brightStars = [
        { name: 'Sirius', distance: '8.6 light-years' },
        { name: 'Procyon', distance: '11.4 light-years' },
        { name: 'Altair', distance: '16.8 light-years' },
        { name: 'Vega', distance: '25.3 light-years' },
        { name: 'Arcturus', distance: '37 light-years' },
        { name: 'Capella', distance: '42 light-years' },
        { name: 'Aldebaran', distance: '65 light-years' },
        { name: 'Canopus', distance: '313 light-years' }
      ];
      const moonPhases = [
        { name: 'New Moon', angle: 0 },
        { name: 'Waxing crescent', angle: Math.PI * .25 },
        { name: 'First quarter', angle: Math.PI * .5 },
        { name: 'Waxing gibbous', angle: Math.PI * .75 },
        { name: 'Full Moon', angle: Math.PI },
        { name: 'Waning gibbous', angle: Math.PI * 1.25 },
        { name: 'Last quarter', angle: Math.PI * 1.5 },
        { name: 'Waning crescent', angle: Math.PI * 1.75 },
        { name: 'Balsamic Moon', angle: Math.PI * 1.875 }
      ];
      const phaseSeed = crypto.getRandomValues(new Uint32Array(1))[0] % moonPhases.length;
      const moonStartAngle = moonPhases[phaseSeed].angle;
      const moonPlacementSeed = crypto.getRandomValues(new Uint32Array(2));
      const orbiterNameSeed = crypto.getRandomValues(new Uint32Array(1))[0];
      let previousStar = -1;
      try { const storedStar = localStorage.getItem('communique-last-orbiter-star'); if (storedStar !== null) previousStar = Number(storedStar); } catch (_) {}
      let starIndex = orbiterNameSeed % (brightStars.length - 1);
      if (Number.isInteger(previousStar) && previousStar >= 0 && previousStar < brightStars.length && starIndex >= previousStar) starIndex++;
      const selectedStar = brightStars[starIndex];
      try { localStorage.setItem('communique-last-orbiter-star', String(starIndex)); } catch (_) {}
      orbiterLabelName.textContent = selectedStar.name;
      orbiterLabelDistance.textContent = selectedStar.distance;
      const moonPlacement = {
        edge: ['top', 'right', 'bottom', 'left'][moonPlacementSeed[0] % 4],
        along: .18 + (moonPlacementSeed[1] / 0xffffffff) * .64,
        overlap: .08 + ((moonPlacementSeed[0] >>> 8) % 1000) / 1000 * .28
      };
      const pointer = { x: .5, y: .5 }, pointerTarget = { x: .5, y: .5 }, hoverPointer = { clientX: -999, clientY: -999 };
      let width, height, dpr, particles, blobs, sparks, filaments, galaxyClouds, meteors, orbiter, orbiterHit = null, filamentSteps, animationTime = 0, lastFrame = 0;
      const colors = [[72, 124, 234], [110, 165, 255], [167, 205, 255], [222, 236, 255]];
      const random = (min, max) => min + Math.random() * (max - min);
      const rgba = (rgb, a) => `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`;

      function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2); width = innerWidth; height = innerHeight;
        canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        orbitForeground.width = Math.round(width * dpr); orbitForeground.height = Math.round(height * dpr); orbitCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const physicalPixels = width * height * dpr * dpr;
        const detail = physicalPixels > 6000000 ? .50 : physicalPixels > 3200000 ? .68 : 1;
        const amount = Math.max(85, Math.round(Math.max(95, Math.min(180, width * height / 10500)) * detail));

        slice.style.setProperty('--target-z', `${Math.cos(longitude) * radius * .18}px`);
        slice.style.setProperty('--early-rotation', `${rotation * .18}deg`);
        slice.style.setProperty('--slice-rotation', `${rotation}deg`);
        slice.style.setProperty('--early-scale-x', `${1 + (scaleX - 1) * .18}`);
        slice.style.setProperty('--early-scale-y', `${1 + (scaleY - 1) * .18}`);
        slice.style.setProperty('--scale-x', `${scaleX}`);
        slice.style.setProperty('--scale-y', `${scaleY}`);
        slice.style.setProperty('--slice-light', `${.58 + Math.cos(longitude) * .42}`);
        slice.style.setProperty('--slice-delay', `${Math.abs(index - (slices - 1) / 2) * 18}ms`);

        const content = card.cloneNode(true);
        content.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
        content.querySelectorAll('input, button, a').forEach(node => node.tabIndex = -1);
        content.setAttribute('aria-hidden', 'true');
        content.style.left = `${-index * sourceWidth}px`;
        content.style.top = '0';
        content.style.width = `${rect.width}px`;
        content.style.height = `${rect.height}px`;
        slice.appendChild(content);
        stage.appendChild(slice);
      }

      const surface = document.createElement('div');
      surface.className = 'globe-surface';
      surface.style.left = `${center.x - radius}px`;
      surface.style.top = `${center.y - radius}px`;
      surface.style.width = `${radius * 2}px`;
      surface.style.height = `${radius * 2}px`;
      const surfaceGrid = document.createElement('div');
      surfaceGrid.className = 'globe-grid';
      surface.appendChild(surfaceGrid);

      const glyphs = '000111222333444555666777888999ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const characters = Array.from({ length: 68 }, (_, index) => {
        const element = document.createElement('span');
        element.className = 'data-orbit';
        element.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
        element.dataset.longitude = String(Math.random() * Math.PI * 2);
        element.dataset.latitude = String((Math.random() - .5) * Math.PI * .86);
        surface.appendChild(element);
        return element;
      });
      stage.appendChild(surface);

      const speedField = document.createElement('div');
      speedField.className = 'speed-field';
      speedField.style.left = `${center.x - radius * 1.75}px`;
      speedField.style.top = `${center.y - radius * .78}px`;
      speedField.style.width = `${radius * 3.5}px`;
      speedField.style.height = `${radius * 1.56}px`;
      for (let index = 0; index < 4; index++) {
        const ring = document.createElement('span');
        ring.className = 'speed-ring';
        ring.style.setProperty('--ring-inset', `${index * 8}px ${index * 21}px`);
        ring.style.setProperty('--ring-alpha', `${.12 + index * .035}`);
        ring.style.setProperty('--ring-angle', `${-12 + index * 8}deg`);
        ring.style.setProperty('--ring-squash', `${.42 + index * .07}`);
        speedField.appendChild(ring);
      }
      for (let index = 0; index < 16; index++) {
        const streak = document.createElement('span');
        streak.className = 'speed-streak';
        streak.style.setProperty('--streak-angle', `${index / 16 * 360 + Math.random() * 9}deg`);
        streak.style.setProperty('--streak-distance', `${radius * (.96 + Math.random() * .65)}px`);
        streak.style.setProperty('--streak-length', `${22 + Math.random() * 52}px`);
        streak.style.setProperty('--streak-alpha', `${.12 + Math.random() * .35}`);
        speedField.appendChild(streak);
      }
      stage.appendChild(speedField);
      document.body.appendChild(stage);
      requestAnimationFrame(() => document.body.classList.add('globe-running'));

      const orbitStarts = performance.now() + 2050;
      function animateCharacters(now) {
        const progress = Math.max(0, Math.min(1, (now - orbitStarts) / 5000));
        const acceleration = (Math.exp(progress * 3.5) - 1) / (Math.exp(3.5) - 1);
        const globeTurn = acceleration * Math.PI * 2 * 5.2;
        if (progress > 0) stage.classList.add('formed');
        surfaceGrid.style.transform = `rotate(${globeTurn * .14}rad) scaleX(${.92 + Math.sin(globeTurn) * .055})`;
        surfaceGrid.style.filter = `blur(${acceleration * .55}px)`;
        characters.forEach((character, index) => {
          const latitude = Number(character.dataset.latitude);
          const longitude = Number(character.dataset.longitude) + globeTurn;
          const depth = Math.cos(latitude) * Math.cos(longitude);
          const x = radius + Math.cos(latitude) * Math.sin(longitude) * radius * .88;
          const y = radius + Math.sin(latitude) * radius * .82;
          const reveal = Math.min(1, Math.max(0, (now - orbitStarts - index * 9) / 330));
          const ending = Math.min(1, (1 - progress) * 8);
          const facing = Math.max(0, Math.min(1, (depth + .08) / .42));
          character.style.opacity = String(reveal * ending * facing * (.42 + Math.max(0, depth) * .58));
          character.style.filter = `blur(${Math.max(0, .22 - depth) * 1.4 + acceleration * .28}px)`;
          character.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%,-50%) scale(${.68 + Math.max(0, depth) * .48})`;
        });
        const speedReveal = Math.min(1, Math.max(0, progress * 5));
        const speedEnding = Math.min(1, (1 - progress) * 7);
        speedField.style.opacity = String(speedReveal * speedEnding * (.18 + acceleration * .82));
        speedField.style.transform = `rotate(${globeTurn * .065}rad) scaleX(${1 + acceleration * .20})`;
        speedField.style.filter = `blur(${acceleration * .72}px)`;
        if (progress < 1) requestAnimationFrame(animateCharacters);
        else setTimeout(() => location.reload(), 180);
      }
      requestAnimationFrame(animateCharacters);
    }
    function runMelting() {
      const card = document.querySelector('.login-card');
      const rect = card.getBoundingClientRect();
      const stage = document.createElement('div');
      stage.className = 'melt-stage';
      const strips = 44;
      const stripWidth = rect.width / strips;

      for (let index = 0; index < strips; index++) {
        const strip = document.createElement('div');
        strip.className = 'melt-strip';
        strip.style.left = `${rect.left + index * stripWidth}px`;
        strip.style.top = `${rect.top}px`;
        strip.style.width = `${stripWidth + .8}px`;
        strip.style.height = `${rect.height}px`;

        const wave = Math.sin(index * .61 + Math.sin(index * .27)) * 22;
        const secondaryWave = Math.cos(index * .39) * 13;
        const meltDistance = 92 + Math.random() * 172 + Math.abs(wave);
        const stretch = 1.08 + Math.random() * .52;
        const bend = (Math.random() - .5) * 8;
        strip.style.setProperty('--sway-a', `${wave * .12}px`);
        strip.style.setProperty('--sway-b', `${wave * .48 + secondaryWave * .18}px`);
        strip.style.setProperty('--sway-c', `${wave + secondaryWave * .56}px`);
        strip.style.setProperty('--sway-d', `${wave * 1.28 + secondaryWave + (Math.random() - .5) * 17}px`);
        strip.style.setProperty('--mid-y', `${meltDistance * .20}px`);
        strip.style.setProperty('--end-y', `${meltDistance * .66}px`);
        strip.style.setProperty('--exit-y', `${meltDistance}px`);
        strip.style.setProperty('--mid-width', `${.82 + Math.random() * .30}`);
        strip.style.setProperty('--stretch', `${stretch}`);
        strip.style.setProperty('--end-stretch', `${stretch + .26 + Math.random() * .34}`);
        strip.style.setProperty('--exit-stretch', `${stretch + .58 + Math.random() * .44}`);
        strip.style.setProperty('--bend-a', `${bend * .18}deg`);
        strip.style.setProperty('--bend-b', `${bend * .62}deg`);
        strip.style.setProperty('--bend-c', `${bend + secondaryWave * .10}deg`);
        strip.style.setProperty('--bend-d', `${bend * 1.38 + secondaryWave * .16}deg`);
        strip.style.setProperty('--skew-a', `${wave * .045}deg`);
        strip.style.setProperty('--skew-b', `${-wave * .10}deg`);
        strip.style.setProperty('--skew-c', `${secondaryWave * .20}deg`);
        strip.style.setProperty('--skew-d', `${(wave + secondaryWave) * .20}deg`);
        strip.style.setProperty('--liquid-round', `${5 + Math.random() * 14}px`);
        strip.style.setProperty('--melt-delay', `${Math.abs(index - strips / 2) * 3 + Math.random() * 96}ms`);

        const content = card.cloneNode(true);
        content.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
        content.querySelectorAll('input, button, a').forEach(node => node.tabIndex = -1);
        content.setAttribute('aria-hidden', 'true');
        content.style.left = `${-index * stripWidth}px`;
        content.style.top = '0';
        content.style.width = `${rect.width}px`;
        content.style.height = `${rect.height}px`;
        strip.appendChild(content);
        stage.appendChild(strip);
      }

      const sheen = document.createElement('div');
      sheen.className = 'melt-sheen';
      sheen.style.left = `${rect.left}px`;
      sheen.style.top = `${rect.top}px`;
      sheen.style.width = `${rect.width}px`;
      sheen.style.height = `${rect.height}px`;
      stage.appendChild(sheen);

      for (let index = 0; index < 30; index++) {
        const drop = document.createElement('span');
        const size = 3.5 + Math.random() * 13;
        const fall = 80 + Math.random() * 175;
        drop.className = 'melt-drop';
        drop.style.left = `${rect.left + rect.width * (.04 + Math.random() * .92)}px`;
        drop.style.top = `${rect.bottom - size * .35}px`;
        drop.style.width = `${size}px`;
        drop.style.height = `${size * (1.12 + Math.random() * .72)}px`;
        drop.style.setProperty('--drop-delay', `${720 + Math.random() * 850}ms`);
        drop.style.setProperty('--drop-drift', `${(Math.random() - .5) * 42}px`);
        drop.style.setProperty('--drop-fall', `${fall}px`);
        drop.style.setProperty('--drop-exit', `${fall + 72 + Math.random() * 85}px`);
        drop.style.setProperty('--drop-rotate', `${(Math.random() - .5) * 36}deg`);
        stage.appendChild(drop);
      }

      document.body.appendChild(stage);
      requestAnimationFrame(() => document.body.classList.add('melt-running'));
      setTimeout(() => location.reload(), 4140);
    }
    form.addEventListener('submit', event => {
      event.preventDefault();
      if (!form.checkValidity()) { form.reportValidity(); return; }
      const username = document.querySelector('#email').value.trim().toLowerCase();
      if (username !== 'communique' || password.value !== 'cinemark') {
        status.textContent = 'Invalid credentials. Use communique and cinemark for this test.';
        return;
      }
      status.textContent = 'Access granted.';
      form.querySelectorAll('input, button').forEach(control => control.disabled = true);
      setTimeout(runMelting, 240);
    });
  </script>
</body>
</html>
